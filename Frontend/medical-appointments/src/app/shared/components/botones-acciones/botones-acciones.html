<div class="botones-acciones">

  <button
    *ngIf="mostrarVer"
    type="button"
    class="btn-accion btn-ver"
    title="Ver"
    [disabled]="deshabilitado"
    (click)="emitirVer()">
    <i class="bi bi-eye"></i>
  </button>

  <button
    *ngIf="mostrarEditar"
    type="button"
    class="btn-accion btn-editar"
    title="Editar"
    [disabled]="deshabilitado"
    (click)="emitirEditar()">
    <i class="bi bi-pencil"></i>
  </button>

  <button
    *ngIf="mostrarAnular"
    type="button"
    class="btn-accion btn-anular"
    title="Anular"
    [disabled]="deshabilitado"
    (click)="emitirAnular()">
    <i class="bi bi-x-circle"></i>
  </button>

  <button
    *ngIf="mostrarEliminar"
    type="button"
    class="btn-accion btn-eliminar"
    title="Eliminar"
    [disabled]="deshabilitado"
    (click)="emitirEliminar()">
    <i class="bi bi-trash"></i>
  </button>

</div>
